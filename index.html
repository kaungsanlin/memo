<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Hub & Storage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 30px; padding: 20px 0; border-bottom: 1px solid #334155; }
    h1 { font-size: 1.8rem; color: #38bdf8; margin-bottom: 8px; }
    
    /* Navigation Tabs */
    .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
    .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: 0.2s; }
    .tab-btn.active { background: #0284c7; color: #fff; border-color: #0284c7; }
    
    .section { display: none; }
    .section.active { display: block; }
    
    .section-title { margin-bottom: 20px; color: #f1f5f9; font-size: 1.3rem; border-left: 4px solid #38bdf8; padding-left: 10px; }
    
    /* Grid Layout */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; border: 1px solid #334155; text-align: center; transition: transform 0.2s; }
    .card:hover { transform: translateY(-3px); }
    
    .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #334155; }
    .card h3 { font-size: 1rem; margin-bottom: 10px; color: #e2e8f0; word-break: break-all; }
    
    .btn { display: inline-block; background: #0284c7; color: #fff; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: bold; }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🚀 My Personal App & Photo Hub</h1>
    <p>ဖိုင်များနှင့် ပုံများ သိမ်းဆည်းရာ စာမျက်နှာ</p>
  </header>

  <!-- Menu Switcher Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('apps')">📱 Apps List (<span id="app-count">0</span>)</button>
    <button class="tab-btn" onclick="switchTab('photos')">🖼️ Photo List (<span id="photo-count">0</span>)</button>
  </div>

  <!-- Apps Section -->
  <div id="apps-section" class="section active">
    <h2 class="section-title">Applications & APKs</h2>
    <div id="apps-grid" class="grid">
      <!-- GitHub ထဲက apps တွေ ဒီနေရာမှာ အလိုအလျောက် ဝင်လာပါမယ် -->
    </div>
  </div>

  <!-- Photos Section -->
  <div id="photos-section" class="section">
    <h2 class="section-title">Photos & Images</h2>
    <div id="photos-grid" class="grid">
      <!-- GitHub ထဲက ပုံတွေ ဒီနေရာမှာ အလိုအလျောက် ဝင်လာပါမယ် -->
    </div>
  </div>
</div>

<script>
  // Tab ပြောင်းရန် Function
  function switchTab(tabName) {
    document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    
    if(tabName === 'apps') {
      document.getElementById('apps-section').classList.add('active');
      event.currentTarget.classList.add('active');
    } else {
      document.getElementById('photos-section').classList.add('active');
      event.currentTarget.classList.add('active');
    }
  }

  // GitHub Repository အချက်အလက်များ (မိမိ Username နဲ့ Repo နာမည်ကို ထည့်ပါ)
  const username = "kaungsanlin"; 
  const repoName = "repo-name"; // မိမိ Repository နာမည် အမှန်ထည့်ပါ

  // GitHub API မှတစ်ဆင့် Folder ထဲက ဖိုင်များကို ဖတ်ယူခြင်း
  async function loadFiles(folder, gridId, countId, isImage = false) {
    const apiUrl = `https://api.github.com/repos/${username}/${repoName}/contents/${folder}`;
    try {
      const response = await fetch(apiUrl);
      const files = await response.json();
      
      const grid = document.getElementById(gridId);
      grid.innerHTML = "";
      let count = 0;

      if(Array.isArray(files)) {
        files.forEach(file => {
          // ဖိုင်များကို စစ်ထုတ်ခြင်း (APK သို့မဟုတ် ပုံဖိုင်များ)
          if(isImage && (file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i))) {
            count++;
            grid.innerHTML += `
              <div class="card">
                <img src="${file.download_url}" alt="${file.name}">
                <h3>${file.name}</h3>
                <a href="${file.download_url}" class="btn" target="_blank">View Full Size</a>
              </div>
            `;
          } else if(!isImage && file.type === "file") {
            count++;
            grid.innerHTML += `
              <div class="card">
                <h3>📦 ${file.name}</h3>
                <a href="${file.download_url}" class="btn" download>Download App</a>
              </div>
            `;
          }
        });
      }
      document.getElementById(countId).innerText = count;
    } catch (error) {
      console.error("Error loading files:", error);
    }
  }

  // Page စပွင့်တာနဲ့ ဖိုင်တွေကို လှမ်းဆွဲထုတ်ရန်
  window.onload = () => {
    loadFiles('apps', 'apps-grid', 'app-count', false);
    loadFiles('images', 'photos-grid', 'photo-count', true);
  };
</script>

</body>
</html>
