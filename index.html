<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storage Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Myanmar:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' },
            darkbg: '#0f172a',
            cardbg: '#1e293b',
            bordercolor: '#334155'
          },
          fontFamily: { sans: ['Inter', 'Noto Sans Myanmar', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', 'Noto Sans Myanmar', sans-serif; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .lightbox { display: none; position: fixed; z-index: 100; inset: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); }
    .lightbox.active { display: flex; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-brand-500 selection:text-white">

  <div class="max-w-6xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 flex-grow">
    
    <!-- Header -->
    <header class="text-center mb-8 border-b border-bordercolor pb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-600/20 text-brand-400 mb-4 ring-1 ring-brand-500/30">
        <i class="fa-solid fa-cloud-arrow-up text-3xl"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">Storage Hub</h1>
      <p class="text-slate-400 text-sm sm:text-base mt-2">📂📂📂</p>
    </header>

    <!-- Navigation Tabs -->
    <nav class="flex justify-center mb-6">
      <div class="bg-cardbg p-1.5 rounded-2xl border border-bordercolor flex gap-1 sm:gap-2 max-w-md w-full justify-between shadow-xl">
        <button id="btn-photos" onclick="switchCategory('photos')" class="tab-btn flex-1 py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center justify-center gap-2 bg-brand-600 text-white shadow-md">
          <i class="fa-solid fa-image"></i> Photos <span id="badge-photos" class="bg-brand-900/60 text-xs px-2 py-0.5 rounded-full font-mono">0</span>
        </button>
        <button id="btn-apps" onclick="switchCategory('apps')" class="tab-btn flex-1 py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold text-slate-400 hover:text-white flex items-center justify-center gap-2">
          <i class="fa-solid fa-mobile-screen"></i> Apps <span id="badge-apps" class="bg-slate-800 text-xs px-2 py-0.5 rounded-full font-mono">0</span>
        </button>
        <button id="btn-others" onclick="switchCategory('others')" class="tab-btn flex-1 py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold text-slate-400 hover:text-white flex items-center justify-center gap-2">
          <i class="fa-solid fa-folder-open"></i> Others <span id="badge-others" class="bg-slate-800 text-xs px-2 py-0.5 rounded-full font-mono">0</span>
        </button>
      </div>
    </nav>

    <!-- Search Bar -->
    <div class="max-w-md mx-auto mb-8">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" onkeyup="filterItems()" placeholder="ဖိုင်နာမည်ရှာရန်..." class="w-full bg-cardbg border border-bordercolor text-slate-200 placeholder-slate-400 text-sm rounded-xl pl-11 pr-4 py-3 focus:outline-none focus:border-brand-500 shadow-inner">
      </div>
    </div>

    <!-- 1. PHOTOS & VIDEOS SECTION -->
    <section id="category-photos" class="tab-content active">
      <div class="flex items-center justify-between mb-4 border-b border-bordercolor/50 pb-2">
        <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2"><i class="fa-solid fa-images text-brand-400"></i> Photos & Videos</h2>
        <span class="text-xs text-slate-400"></span>
      </div>
      <div id="grid-photos" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </section>

    <!-- 2. APPS SECTION -->
    <section id="category-apps" class="tab-content">
      <div class="flex items-center justify-between mb-4 border-b border-bordercolor/50 pb-2">
        <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2"><i class="fa-solid fa-cubes text-brand-400"></i> Apps & APKs</h2>
        <span class="text-xs text-slate-400"></span>
      </div>
      <div id="grid-apps" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- 3. OTHERS SECTION -->
    <section id="category-others" class="tab-content">
      <div class="flex items-center justify-between mb-4 border-b border-bordercolor/50 pb-2">
        <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2"><i class="fa-solid fa-file-lines text-brand-400"></i> Other Files</h2>
        <span class="text-xs text-slate-400"></span>
      </div>
      <div id="grid-others" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- Loading State -->
    <div id="loading-state" class="text-center py-12 text-slate-400">
      <i class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-brand-400"></i>
      <p>Loading...</p>
    </div>

  </div>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox flex-col items-center justify-center p-4">
    <button onclick="closeLightbox()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-3xl p-2"><i class="fa-solid fa-xmark"></i></button>
    <div id="lightbox-media-container" class="max-w-4xl max-h-[80vh] overflow-hidden rounded-xl shadow-2xl mb-4 flex items-center justify-center"></div>
    <div class="flex items-center gap-4">
      <span id="lightbox-caption" class="text-slate-300 text-sm font-medium"></span>
      <button id="lightbox-download-btn" onclick="" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold rounded-lg transition flex items-center gap-2">
        <i class="fa-solid fa-download"></i> Download
      </button>
    </div>
  </div>

  <footer class="border-t border-bordercolor/50 py-6 text-center text-xs text-slate-500">
    <p>© Kaung San Lin •Storage Hub•</p>
  </footer>

  <script>
    // ⚠️ အောက်ပါနေရာတွင် သင့် Google Apps Script ရဲ့ Web App URL ကို ထည့်ပါ
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyNpxSv7_YpGlcaIEuzVwFmyW_vIDut85EvsHdj_kfyma_N9Wk0sDHHKWvfOIs7UrzSTA/exec";

    let currentCategory = 'photos';
    let allFilesData = { photos: [], apps: [], others: [] };

    function switchCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
      document.getElementById(`category-${cat}`).classList.add('active');

      document.querySelectorAll('.tab-btn').forEach(b => {
        b.className = "tab-btn flex-1 py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold text-slate-400 hover:text-white flex items-center justify-center gap-2";
      });
      document.getElementById(`btn-${cat}`).className = "tab-btn flex-1 py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 bg-brand-600 text-white shadow-md";
      filterItems();
    }

    async function fetchTelegramFiles() {
      try {
        const res = await fetch(GAS_WEB_APP_URL);
        const files = await res.json();
        
        if (Array.isArray(files)) {
          files.forEach(file => {
            const ext = file.name.split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'webp', 'mp4', 'webm', 'mov'].includes(ext)) {
              allFilesData.photos.push(file);
            } else if (['apk', 'exe', 'zip', 'rar'].includes(ext)) {
              allFilesData.apps.push(file);
            } else {
              allFilesData.others.push(file);
            }
          });
        }

        document.getElementById('badge-photos').textContent = allFilesData.photos.length;
        document.getElementById('badge-apps').textContent = allFilesData.apps.length;
        document.getElementById('badge-others').textContent = allFilesData.others.length;

        renderAll();
      } catch (err) {
        console.error("Error fetching files:", err);
        document.getElementById('loading-state').innerHTML = '<p class="text-red-400">ဖိုင်များ ဆွဲထုတ်ရာတွင် အမှားအယွင်း ရှိနေပါသည်။</p>';
      }
    }

    async function downloadFile(url, filename) {
      try {
        const response = await fetch(url);
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(blobUrl);
        document.body.removeChild(a);
      } catch (err) {
        window.open(url, '_blank');
      }
    }

    function renderAll() {
      // Photos & Videos
      const pGrid = document.getElementById('grid-photos');
      pGrid.innerHTML = allFilesData.photos.map(file => {
        const isVideo = file.name.match(/\.(mp4|webm|mov)$/i);
        if (isVideo) {
          return `
            <div class="item-card bg-cardbg border border-bordercolor rounded-xl overflow-hidden shadow-lg group">
              <div class="relative aspect-video bg-slate-900 flex items-center justify-center">
                <video src="${file.url}" class="w-full h-full object-cover"></video>
                <button onclick="openLightbox('${file.url}', '${file.name}', true)" class="absolute inset-0 bg-slate-950/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white">
                  <i class="fa-solid fa-play text-3xl"></i>
                </button>
              </div>
              <div class="p-3">
                <h3 class="item-title font-medium text-sm text-slate-200 truncate mb-2">${file.name}</h3>
                <div class="flex gap-2">
                  <button onclick="openLightbox('${file.url}', '${file.name}', true)" class="flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg transition text-center"><i class="fa-solid fa-play mr-1"></i> ကြည့်မည်</button>
                  <button onclick="downloadFile('${file.url}', '${file.name}')" class="flex-1 py-1.5 bg-brand-600 hover:bg-brand-700 text-white text-xs rounded-lg transition text-center"><i class="fa-solid fa-download mr-1"></i> Download</button>
                </div>
              </div>
            </div>
          `;
        } else {
          return `
            <div class="item-card bg-cardbg border border-bordercolor rounded-xl overflow-hidden shadow-lg group">
              <div class="relative aspect-square bg-slate-900">
                <img src="${file.url}" alt="${file.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                <button onclick="openLightbox('${file.url}', '${file.name}', false)" class="absolute inset-0 bg-slate-950/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white">
                  <i class="fa-solid fa-maximize text-2xl"></i>
                </button>
              </div>
              <div class="p-3">
                <h3 class="item-title font-medium text-sm text-slate-200 truncate mb-2">${file.name}</h3>
                <div class="flex gap-2">
                  <button onclick="openLightbox('${file.url}', '${file.name}', false)" class="flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg transition text-center"><i class="fa-solid fa-eye mr-1"></i> ကြည့်မည်</button>
                  <button onclick="downloadFile('${file.url}', '${file.name}')" class="flex-1 py-1.5 bg-brand-600 hover:bg-brand-700 text-white text-xs rounded-lg transition text-center"><i class="fa-solid fa-download mr-1"></i> Download</button>
                </div>
              </div>
            </div>
          `;
        }
      }).join('') || '<p class="text-slate-500 col-span-full text-center py-6">ဖိုင်များ မရှိသေးပါ။</p>';

      // Apps
      const aGrid = document.getElementById('grid-apps');
      aGrid.innerHTML = allFilesData.apps.map(file => `
        <div class="item-card bg-cardbg border border-bordercolor rounded-2xl p-4 shadow-lg flex flex-col justify-between">
          <div class="flex items-start gap-3 mb-3">
            <div class="w-12 h-12 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-brand-400 text-2xl flex-shrink-0">
              <i class="fa-brands fa-android"></i>
            </div>
            <div class="overflow-hidden">
              <h3 class="item-title font-semibold text-base text-slate-100 truncate">${file.name}</h3>
              <p class="text-xs text-slate-400 mt-0.5">Android APK</p>
            </div>
          </div>
          <button onclick="downloadFile('${file.url}', '${file.name}')" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold rounded-xl transition flex items-center justify-center gap-2 shadow-md">
            <i class="fa-solid fa-download"></i> ဒေါင်းလုဒ်ရယူရန်
          </button>
        </div>
      `).join('') || '<p class="text-slate-500 col-span-full text-center py-6">Apps များ မရှိသေးပါ။</p>';

      // Others
      const oGrid = document.getElementById('grid-others');
      oGrid.innerHTML = allFilesData.others.map(file => `
        <div class="item-card bg-cardbg border border-bordercolor rounded-2xl p-4 shadow-lg flex items-center justify-between">
          <div class="flex items-center gap-3 overflow-hidden">
            <div class="w-10 h-10 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 flex items-center justify-center text-xl flex-shrink-0">
              <i class="fa-solid fa-file-lines"></i>
            </div>
            <div class="overflow-hidden">
              <h3 class="item-title font-medium text-sm text-slate-200 truncate">${file.name}</h3>
              <p class="text-xs text-slate-400 mt-0.5">Document / File</p>
            </div>
          </div>
          <button onclick="downloadFile('${file.url}', '${file.name}')" class="p-2.5 bg-slate-800 hover:bg-brand-600 text-slate-300 hover:text-white rounded-xl transition flex-shrink-0 ml-2">
            <i class="fa-solid fa-download"></i>
          </button>
        </div>
      `).join('') || '<p class="text-slate-500 col-span-full text-center py-6">ဖိုင်များ မရှိသေးပါ။</p>';

      document.getElementById('loading-state').style.display = 'none';
    }

    function filterItems() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const activeSec = document.getElementById(`category-${currentCategory}`);
      const cards = activeSec.querySelectorAll('.item-card');
      cards.forEach(card => {
        const title = card.querySelector('.item-title').textContent.toLowerCase();
        card.style.display = title.includes(query) ? '' : 'none';
      });
    }

    function openLightbox(url, title, isVideo) {
      const container = document.getElementById('lightbox-media-container');
      if (isVideo) {
        container.innerHTML = `<video src="${url}" controls autoplay class="max-w-full max-h-[80vh] rounded-lg"></video>`;
      } else {
        container.innerHTML = `<img src="${url}" alt="Full View" class="max-w-full max-h-[80vh] object-contain">`;
      }
      document.getElementById('lightbox-caption').textContent = title;
      document.getElementById('lightbox-download-btn').setAttribute('onclick', `downloadFile('${url}', '${title}')`);
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      const container = document.getElementById('lightbox-media-container');
      container.innerHTML = '';
      document.getElementById('lightbox').classList.remove('active');
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetchTelegramFiles();
    });
  </script>
</body>
</html>
